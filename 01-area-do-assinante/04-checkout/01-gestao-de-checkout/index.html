<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../../../04-design-system/proluno.css">
<style>
  .ck-head .pl-page-lead { max-width: 720px; margin: 10px 0 0; font-size: 16px; }

  /* Filtro por tipo: Select nativo com o chevron do Design System */
  .ck-filter { width: 220px; }
  .ck-filter select { appearance: none; -webkit-appearance: none; padding-right: 36px; color: var(--ink-body); }
  .ck-filter > svg { position: absolute; top: 50%; right: 12px; width: 15px; height: 15px; color: var(--ink-faint); transform: translateY(-50%); pointer-events: none; }

  /* Tabela */
  .ck-table td { padding-top: 14px; padding-bottom: 14px; }
  .ck-table th:first-child { width: 40%; }
  .ck-name { display: block; overflow: hidden; font-weight: 600; color: var(--ink-heading); white-space: nowrap; text-overflow: ellipsis; }
  .ck-id { font-variant-numeric: tabular-nums; }
  .ck-date { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ck-type { display: inline-flex; align-items: center; gap: 6px; }
  .ck-type svg { width: 13px; height: 13px; }
  .ck-copy.is-done { background: var(--success-tint); color: var(--success); }

  /* Contagem acima da lista e Pagination completa centralizada abaixo */
  .ck-count { margin: 0 0 12px; font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .ck-footer { display: flex; justify-content: center; margin-top: 20px; }
  .ck-count strong { font-weight: 600; color: var(--ink-heading); }

  /* Cards no mobile */
  .ck-cards { display: flex; flex-direction: column; gap: 12px; }
  .ck-card { padding: 14px 14px 14px 16px; border: 1px solid var(--line); border-radius: var(--radius-14); background: var(--bg); }
  .ck-card-top { display: flex; align-items: flex-start; gap: 12px; }
  .ck-card-top > div { flex: 1 1 auto; min-width: 0; }
  .ck-card-title { margin: 0 0 6px; font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--ink-heading); }
  .ck-card-top .pl-icon-btn { width: 40px; height: 40px; margin: -6px -6px 0 0; }
  .ck-card-meta { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .ck-card .ck-copy { width: 100%; min-height: 40px; margin-top: 12px; font-size: 13.5px; }

  /* Modal: tipos de checkout */
  .ck-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ck-options .pl-radio-card { align-items: center; padding: 14px 16px; }
  .ck-options .pl-radio-card .pl-radio { margin-top: 0; }
  .ck-options .pl-radio-card:hover:not(.is-selected) { border-color: var(--line-strong); }
  .ck-modal .pl-modal-subtitle strong { font-weight: 600; color: var(--ink-heading); }

  @media (max-width: 768px) {
    .ck-head .pl-page-lead { font-size: 14.5px; }
    .ck-filter { width: 100%; }
    .ck-filter select { font-size: 16px; }
    .ck-modal { align-self: flex-end; max-width: none; border-radius: var(--radius-16) var(--radius-16) 0 0; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    #typeModal { padding: 0; align-items: flex-end; }
    .ck-modal .pl-modal-actions .pl-btn { min-height: var(--size-control-lg); }
  }
</style>
</head>
<body data-page="04-checkout/01-gestao-de-checkout/">

<div class="pl-app">
  <!-- Menu principal (vira gaveta abaixo de 768px) -->
  <aside class="pl-app-sidebar" id="appNav" aria-label="Menu principal">
    <div class="pl-app-brand">

<div class="pl-toast-region" id="toasts" role="status" aria-live="polite"></div>

<script src="../../assets/app-shell.js"></script>
<script>
(function () {
  var S = window.PLShell, icon = S.icon, esc = S.esc, norm = S.norm, plural = S.plural, toast = S.toast;
  var TYPES = { default: 'Padrão', launch: 'Lançamento' };
  var PER_PAGE = 10;

  var products = [
    { name: 'Preparatório Farmácia para Concursos e Residências', type: 'default', id: 4993, updated: '24/09/2026 17:20', by: '' },
    { name: 'Direito Constitucional na Prática', type: 'default', id: 4991, updated: '27/08/2026 15:06', by: '' },
    { name: 'Festival das Imparáveis', type: 'default', id: 4990, updated: '27/08/2026 12:27', by: '' },
    { name: 'Treino Discursivas', type: 'default', id: 4989, updated: '27/08/2026 12:02', by: '' },
    { name: 'Direito Constitucional para Iniciantes', type: 'default', id: 4988, updated: '27/08/2026 12:00', by: '' },
    { name: 'Gold Face', type: 'default', id: 4987, updated: '27/08/2026 11:20', by: '' },
    { name: 'A Verdadeira Harmonia', type: 'default', id: 4986, updated: '27/08/2026 11:20', by: '' },
    { name: 'Além do Óbvio', type: 'default', id: 4985, updated: '27/08/2026 11:20', by: '' },
    { name: 'Presets - Posts Incríveis', type: 'default', id: 4984, updated: '27/08/2026 11:18', by: '' },
    { name: 'Imagem de Influência', type: 'launch', id: 4983, updated: '27/08/2026 12:40', by: 'Júlia Fonseca' },
    { name: 'Mentoria Imparável', type: 'default', id: 4982, updated: '27/08/2026 11:16', by: '' },
    { name: 'Direitos e Garantias Fundamentais em Questões', type: 'default', id: 4981, updated: '27/08/2026 11:15', by: '' },
    { name: 'Controle de Constitucionalidade na Prática', type: 'default', id: 4980, updated: '27/08/2026 11:15', by: '' },
    { name: 'Mentoria Imparável + Bônus', type: 'launch', id: 4976, updated: '27/08/2026 15:19', by: 'Júlia Fonseca' },
    { name: 'Turma Além do Óbvio + Bônus', type: 'launch', id: 4975, updated: '27/08/2026 12:20', by: 'Júlia Fonseca' },
    { name: 'Aprova Concursos', type: 'launch', id: 4973, updated: '20/08/2026 18:05', by: 'Júlia Fonseca' },
    { name: 'Oficial de Justiça - TJCE 2026', type: 'default', id: 4969, updated: '05/06/2026 15:43', by: '' },
    { name: 'Blusa Aulão GCM', type: 'default', id: 4968, updated: '01/06/2026 11:51', by: 'Júlia Fonseca' },
    { name: 'Gravação Aulão GCM', type: 'launch', id: 4967, updated: '10/08/2026 08:15', by: 'Júlia Fonseca' },
    { name: 'AULÃO GCM', type: 'launch', id: 4966, updated: '20/08/2026 17:56', by: 'Júlia Fonseca' },
    { name: 'Cronograma', type: 'default', id: 4965, updated: '18/05/2026 16:47', by: '' },
    { name: 'Nebulosa', type: 'launch', id: 4964, updated: '19/05/2026 11:03', by: 'Júlia Fonseca' },
    { name: 'Sunshine', type: 'default', id: 4958, updated: '15/04/2026 11:42', by: '' },
    { name: 'Star', type: 'launch', id: 4945, updated: '30/07/2026 12:14', by: 'Júlia Fonseca' },
    { name: 'Galaxy', type: 'launch', id: 4944, updated: '28/04/2026 15:52', by: 'Júlia Fonseca' },
    { name: 'Universe', type: 'launch', id: 4943, updated: '27/04/2026 17:28', by: 'Júlia Fonseca' },
    { name: 'Aurora - Teste', type: 'launch', id: 4942, updated: '06/04/2026 14:05', by: 'Júlia Fonseca' },
    { name: 'Curso Intermediário', type: 'launch', id: 4941, updated: '19/05/2026 11:04', by: 'Júlia Fonseca' },
    { name: 'Aurora Proluno', type: 'default', id: 4940, updated: '18/02/2026 15:17', by: '' },
    { name: 'Teste de Produto', type: 'launch', id: 4939, updated: '10/02/2026 18:04', by: 'Júlia Fonseca' },
    { name: 'Curso Exemplo', type: 'launch', id: 4937, updated: '28/04/2026 17:33', by: 'Júlia Fonseca' },
    { name: 'IA para Iniciantes', type: 'launch', id: 4934, updated: '30/12/2025 14:03', by: 'Júlia Fonseca' }
  ];
  var HOST = 'https://sandbox-julia.proluno.com.br';
  function checkoutUrl(p) { return p.type === 'launch' ? HOST + '/launch-checkout/' + p.id + '/personal-data' : HOST + '/student-checkout/v3?productId=' + p.id; }
  function byId(id) { for (var i = 0; i < products.length; i++) if (products[i].id === id) return products[i]; }

  /* ---------- Lista ---------- */
  var state = { q: '', type: '', page: 1 };
  var results = document.getElementById('results');
  var mobile = window.matchMedia('(max-width: 768px)');

  function visible() {
    var q = norm(state.q);
    return products.filter(function (p) { return (!q || norm(p.name).indexOf(q) >= 0) && (!state.type || p.type === state.type); });
  }

  function typeTag(p) {
    return '<span class="pl-tag ck-type ' + (p.type === 'launch' ? 'pl-tag--id' : 'pl-tag--neutral') + '">' + TYPES[p.type] + '</span>';
  }
  function menuBtn(p) {
    return '<button class="pl-icon-btn" type="button" data-menu="' + p.id + '" aria-haspopup="menu" aria-expanded="false" aria-label="Ações de ' + esc(p.name) + '">' + icon('more') + '</button>';
  }
  function copyBtn(p) {
    return '<button class="pl-btn pl-btn--tonal ck-copy" type="button" data-copy="' + p.id + '">Copiar link</button>';
  }
  function dateParts(p) { var s = p.updated.split(' '); return { day: s[0], time: s[1] }; }

  function rowHtml(p) {
    var d = dateParts(p);
    return '<tr><td><span class="ck-name" title="' + esc(p.name) + '">' + esc(p.name) + '</span><span class="pl-cell-sub ck-id">ID ' + p.id + '</span></td>' +
      '<td>' + typeTag(p) + '</td>' +
      '<td>' + copyBtn(p) + '</td>' +
      '<td><span class="ck-date">' + d.day + ' às ' + d.time + '</span>' + (p.by ? '<span class="pl-cell-sub">por ' + esc(p.by) + '</span>' : '') + '</td>' +
      '<td class="is-right">' + menuBtn(p) + '</td></tr>';
  }

  function cardHtml(p) {
    var d = dateParts(p);
    return '<article class="ck-card"><div class="ck-card-top"><div><h3 class="ck-card-title">' + esc(p.name) + '</h3>' + typeTag(p) + '</div>' + menuBtn(p) + '</div>' +
      '<p class="ck-card-meta">Atualizado em ' + d.day + ' às ' + d.time + (p.by ? ' · ' + esc(p.by) : '') + '</p>' + copyBtn(p) + '</article>';
  }

  /* Números visíveis: no máximo 5, com reticências entre os blocos (regra da Pagination no Design System) */
  function pageList(pages) {
    if (pages <= 5) return Array.from({ length: pages }, function (_, i) { return i + 1; });
    var p = state.page;
    if (p <= 3) return [1, 2, 3, 4, '…', pages];
    if (p >= pages - 2) return [1, '…', pages - 3, pages - 2, pages - 1, pages];
    return [1, '…', p - 1, p, p + 1, '…', pages];
  }
  function pagerHtml(pages) {
    if (pages < 2) return '';
    var h = '<nav class="pl-pagination" aria-label="Paginação">' +
      '<button class="pl-page-btn pl-page-btn--nav" type="button" data-goto="' + (state.page - 1) + '"' + (state.page === 1 ? ' disabled' : '') + ' aria-label="Página anterior">' + icon('chevron-left') + '</button>';
    pageList(pages).forEach(function (i) {
      h += i === '…' ? '<span class="pl-page-ellipsis">…</span>'
        : '<button class="pl-page-btn' + (i === state.page ? ' is-active' : '') + '" type="button" data-goto="' + i + '"' + (i === state.page ? ' aria-current="page"' : '') + '>' + i + '</button>';
    });
    return h + '<button class="pl-page-btn pl-page-btn--nav" type="button" data-goto="' + (state.page + 1) + '"' + (state.page === pages ? ' disabled' : '') + ' aria-label="Próxima página">' + icon('chevron-right') + '</button></nav>';
  }

  function render() {
    closeMenu();
    var list = visible(), pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * PER_PAGE, slice = list.slice(start, start + PER_PAGE);

    if (!list.length) {
      results.innerHTML = '<div class="pl-empty pl-empty--dashed"><div class="pl-empty-icon">' + icon('search', '', 1.8) + '</div>' +
        '<h3 class="pl-empty-title">Nenhum produto encontrado</h3><p class="pl-empty-text">Confira o nome digitado ou mude o tipo de checkout selecionado.</p></div>';
    } else {
      var body = mobile.matches
        ? '<div class="ck-cards">' + slice.map(cardHtml).join('') + '</div>'
        : '<div class="pl-table-wrap"><table class="pl-table ck-table"><thead><tr><th>Produto</th><th>Tipo de checkout</th><th>Link do checkout</th><th>Última atualização</th><th class="is-right"><span class="pl-sr-only">Ações</span></th></tr></thead><tbody>' +
          slice.map(rowHtml).join('') + '</tbody></table></div>';
      var pager = pagerHtml(pages);
      results.innerHTML = '<p class="ck-count">Mostrando <strong>' + (start + 1) + '–' + (start + slice.length) + '</strong> de <strong>' + plural(list.length, 'produto', 'produtos') + '</strong></p>' +
        body + (pager ? '<div class="ck-footer">' + pager + '</div>' : '');
    }
  }
  if (mobile.addEventListener) mobile.addEventListener('change', render); else mobile.addListener(render);

  /* Busca, filtro por tipo e paginação */
  var search = document.getElementById('search'), searchBox = document.getElementById('searchBox');
  search.addEventListener('input', function () { state.q = search.value; state.page = 1; searchBox.classList.toggle('has-value', !!search.value); render(); });
  document.getElementById('searchClear').addEventListener('click', function (e) { e.preventDefault(); search.value = ''; state.q = ''; state.page = 1; searchBox.classList.remove('has-value'); render(); search.focus(); });
  document.getElementById('typeFilter').addEventListener('change', function () { state.type = this.value; state.page = 1; render(); });
  results.addEventListener('click', function (e) {
    var pg = e.target.closest('[data-goto]');
    if (pg && !pg.disabled) { state.page = +pg.getAttribute('data-goto'); render(); document.getElementById('toolbar').scrollIntoView({ block: 'nearest' }); }
  });

  /* Toolbar fixa no mobile ganha borda quando gruda no topo */
  var toolbar = document.getElementById('toolbar');
  window.addEventListener('scroll', function () { toolbar.classList.toggle('is-stuck', mobile.matches && toolbar.getBoundingClientRect().top <= 57); }, { passive: true });

  /* ---------- Copiar link ---------- */
  function copyText(text) {
    function fallback() { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); }
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback); else fallback(); } catch (e) { fallback(); }
  }
  results.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]'); if (!b) return;
    copyText(checkoutUrl(byId(+b.getAttribute('data-copy'))));
    b.classList.add('is-done'); b.textContent = 'Link copiado';
    setTimeout(function () { if (document.contains(b)) { b.classList.remove('is-done'); b.textContent = 'Copiar link'; } }, 2000);
    toast('Link copiado com sucesso!');
  });

  /* ---------- Menu de ações ---------- */
  var menu = document.getElementById('rowMenu'), menuFor = null, menuBtnEl = null;
  var editItem = menu.querySelector('[data-act="edit"]');
  function closeMenu() { if (menu.hidden) return; menu.hidden = true; if (menuBtnEl) menuBtnEl.setAttribute('aria-expanded', 'false'); menuFor = null; }
  function openMenu(btn) {
    menuFor = +btn.getAttribute('data-menu'); menuBtnEl = btn; btn.setAttribute('aria-expanded', 'true');
    editItem.hidden = byId(menuFor).type !== 'launch';
    menu.hidden = false;
    var r = btn.getBoundingClientRect(), w = menu.offsetWidth, h = menu.offsetHeight;
    var top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    menu.style.top = Math.max(8, top) + 'px'; menu.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';
    menu.querySelector('.pl-menu-item').focus();
  }
  window.addEventListener('resize', closeMenu); window.addEventListener('scroll', closeMenu, true);
  menu.addEventListener('click', function (e) {
    var it = e.target.closest('[data-act]'); if (!it) return;
    var p = byId(menuFor); closeMenu();
    if (p && it.getAttribute('data-act') === 'type') openModal(p);
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-menu]');
    if (t) { e.stopPropagation(); if (menuFor === +t.getAttribute('data-menu') && !menu.hidden) closeMenu(); else openMenu(t); return; }
    if (!menu.hidden && !menu.contains(e.target)) closeMenu();
  });

  /* ---------- Alterar tipo de checkout ---------- */
  var modal = document.getElementById('typeModal'), ok = document.getElementById('tOk'), editing = null, chosen = null, lastFocus = null;
  var options = modal.querySelectorAll('[data-type]');
  function pick(type) {
    chosen = type;
    options.forEach(function (o) { var on = o.getAttribute('data-type') === type; o.classList.toggle('is-selected', on); o.setAttribute('aria-checked', on); });
    ok.disabled = chosen === editing.type;
  }
  function openModal(p) {
    editing = p; lastFocus = menuBtnEl;
    document.getElementById('tText').innerHTML = 'Selecione o tipo de checkout que você deseja que <strong>' + esc(p.name) + '</strong> tenha.';
    pick(p.type);
    modal.classList.add('is-open'); modal.setAttribute('aria-hidden', 'false');
    modal.querySelector('.is-selected').focus();
  }
  function closeModal() {
    modal.classList.remove('is-open'); modal.setAttribute('aria-hidden', 'true'); editing = null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  options.forEach(function (o) { o.addEventListener('click', function () { pick(o.getAttribute('data-type')); }); });
  modal.addEventListener('click', function (e) { if (e.target === modal || e.target.closest('[data-modal-close]')) closeModal(); });
  ok.addEventListener('click', function () {
    if (ok.disabled) return;
    editing.type = chosen; lastFocus = null; closeModal(); render();
    toast('Tipo de checkout alterado!');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!menu.hidden) { closeMenu(); if (menuBtnEl) menuBtnEl.focus(); return; }
    if (modal.classList.contains('is-open')) closeModal();
  });

  render();
})();
</script>
</body>
</html>
