<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Bump · Proluno</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../../04-design-system/proluno.css">
<style>
  .ob-head .pl-page-lead { max-width: 720px; margin: 10px 0 0; font-size: 16px; }

  /* Filtro por produto: Select nativo com o chevron do Design System */
  .ob-filter { width: 300px; }
  .ob-filter select { appearance: none; -webkit-appearance: none; padding-right: 36px; color: var(--ink-body); }
  .ob-filter > svg { position: absolute; top: 50%; right: 12px; width: 15px; height: 15px; color: var(--ink-faint); transform: translateY(-50%); pointer-events: none; }

  .ob-count { margin: 0 0 12px; font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .ob-count strong { font-weight: 600; color: var(--ink-heading); }

  /* Card do order bump: status, nome, produto e preço; as ações ficam no menu ⋮ */
  .ob-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .ob-card { position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 20px 20px 18px; overflow: hidden; border: 1px solid var(--line-soft); border-radius: var(--radius-16); background: var(--bg); box-shadow: 0 1px 2px rgba(17, 19, 23, 0.04); transition: box-shadow 0.18s ease, border-color 0.18s ease; }
  .ob-card:hover { border-color: var(--line); box-shadow: 0 10px 26px rgba(17, 19, 23, 0.08); }
  .ob-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ob-card-head > div { min-width: 0; }
  .ob-state { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; color: var(--success-strong); }
  .ob-card-title { margin: 0 0 3px; overflow: hidden; font-size: 14.5px; font-weight: 700; line-height: 1.3; white-space: nowrap; text-overflow: ellipsis; }
  .ob-card-title a { color: var(--ink-heading); text-decoration: none; }
  .ob-card-title a::after { content: ""; position: absolute; inset: 0; }
  .ob-product { margin: 0; overflow: hidden; font-size: 13.5px; color: var(--ink-muted); white-space: nowrap; text-overflow: ellipsis; }
  .ob-card-head .pl-icon-btn { position: relative; z-index: 1; margin: -4px -6px 0 0; }
  .ob-card-foot { display: flex; align-items: center; gap: 12px; margin-top: auto; }
  .ob-price { padding: 6px 12px; border-radius: var(--radius-8); background: var(--bg-muted); font-size: 15px; font-weight: 700; color: var(--ink-heading); font-variant-numeric: tabular-nums; }

  /* Desativado: conteúdo mais apagado */
  .ob-card.is-off .ob-state { color: var(--ink-faint); }
  .ob-card.is-off .ob-card-title a, .ob-card.is-off .ob-price { color: var(--ink-muted); }

  .ob-footer { display: flex; justify-content: center; margin-top: 20px; }

  @media (max-width: 768px) {
    .ob-head .pl-page-lead { font-size: 14.5px; }
    .ob-filter { width: 100%; }
    .ob-filter select { font-size: 16px; }
    .ob-grid { grid-template-columns: 1fr; gap: 12px; }
    .ob-card-head .pl-icon-btn { width: 40px; height: 40px; margin: -8px -10px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) { .ob-card { transition: none; } }
</style>
</head>
<body data-page="04-checkout/02-order-bump/">

<div class="pl-app">
  <!-- Menu principal (vira gaveta abaixo de 768px) -->
  <aside class="pl-app-sidebar" id="appNav" aria-label="Menu principal">
    <div class="pl-app-brand">
      <a href="../../01-inicio/index.html" aria-label="Proluno — Início"><span class="pl-logo">Prol<span class="pl-logo-dots"><i class="d-teal"></i><i class="d-pink"></i><i class="d-orange"></i><i class="d-blue"></i></span><span class="pl-logo-accent">uno.</span></span></a>
      <button class="pl-icon-btn pl-icon-btn--close pl-drawer-close" type="button" data-nav-close aria-label="Fechar menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-x"/></svg></button>
    </div>
    <nav class="pl-nav" id="appNavList"></nav>
  </aside>
  <div class="pl-backdrop" id="navBackdrop" data-nav-close></div>

  <div class="pl-app-main">
    <header class="pl-mobile-topbar">
      <button class="pl-menu-toggle" type="button" id="navOpen" aria-label="Abrir menu" aria-controls="appNav" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-menu"/></svg></button>
      <span class="pl-logo">Prol<span class="pl-logo-dots"><i class="d-teal"></i><i class="d-pink"></i><i class="d-orange"></i><i class="d-blue"></i></span><span class="pl-logo-accent">uno.</span></span>
      <button class="pl-header-btn" type="button" aria-label="Notificações, 10 novas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bell"/></svg><span class="pl-count-dot">10</span></button>
    </header>
    <header class="pl-app-header">
      <button class="pl-header-btn" type="button" aria-label="Notificações, 10 novas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bell"/></svg><span class="pl-count-dot">10</span></button>
      <a class="pl-user-btn" href="../../08-configuracoes/01-editar-perfil/index.html" aria-label="Meu perfil"><span class="pl-avatar pl-avatar--sm pl-avatar--orange">JF</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-chevron-down"/></svg></a>
    </header>

    <main class="pl-page pl-app-content pl-has-action-bar">
      <div class="pl-stack">
        <div class="ob-head">
          <div class="pl-title-row">
            <h1 class="pl-page-title">Order Bump</h1>
            <div class="pl-title-actions is-desktop">
              <a class="pl-btn pl-btn--primary" href="order-bump.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-plus"/></svg>Adicionar order bump</a>
            </div>
          </div>
          <p class="pl-page-lead">Ofereça um produto extra no checkout para o aluno adicionar ao pedido antes de finalizar a compra.</p>
        </div>

        <div class="pl-stack pl-stack--sm">
          <div class="pl-toolbar" id="toolbar">
            <label class="pl-input pl-toolbar-search" id="searchBox">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-search"/></svg>
              <input type="search" id="search" placeholder="Buscar order bump ou produto" autocomplete="off" aria-label="Buscar order bump ou produto">
              <button class="pl-input-clear" type="button" id="searchClear" aria-label="Limpar busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><use href="#i-x"/></svg></button>
            </label>
            <div class="pl-toolbar-end">
              <div class="pl-select-wrap ob-filter">
                <select class="pl-select" id="productFilter" aria-label="Produto"><option value="">Todos os produtos</option></select>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-down"/></svg>
              </div>
            </div>
          </div>
          <div id="results" aria-live="polite"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Ação principal no mobile -->
<div class="pl-action-bar">
  <a class="pl-btn pl-btn--primary" href="order-bump.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-plus"/></svg>Adicionar order bump</a>
</div>

<!-- Ações do card -->
<div class="pl-menu pl-menu-pop" id="cardMenu" role="menu" hidden>
  <button class="pl-menu-item" type="button" role="menuitem" data-act="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-edit"/></svg>Editar</button>
  <button class="pl-menu-item" type="button" role="menuitem" data-act="toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-zap"/></svg><span>Desativar</span></button>
  <button class="pl-menu-item is-danger" type="button" role="menuitem" data-act="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-trash"/></svg>Excluir</button>
</div>

<!-- Confirmar exclusão -->
<div class="pl-dialog-layer" id="confirm" aria-hidden="true">
  <div class="pl-dialog" role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cText">
    <span class="pl-dialog-icon pl-dialog-icon--danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-trash"/></svg></span>
    <h2 class="pl-dialog-title" id="cTitle">Excluir order bump?</h2>
    <p class="pl-dialog-text" id="cText"></p>
    <div class="pl-modal-actions">
      <button class="pl-btn pl-btn--secondary pl-btn--modal" type="button" data-confirm-close>Cancelar</button>
      <button class="pl-btn pl-btn--danger pl-btn--modal" type="button" id="cOk">Excluir</button>
    </div>
  </div>
</div>

<div class="pl-toast-region" id="toasts" role="status" aria-live="polite"></div>

<script src="../../assets/app-shell.js"></script>
<script src="order-bumps.js"></script>
<script>
(function () {
  var O = window.OrderBumps, icon = O.icon, esc = O.esc, norm = O.norm, plural = O.plural, toast = O.toast;
  var bumps = O.load();
  var FORM = 'order-bump.html', PER_PAGE = 12;
  function editUrl(b) { return FORM + '?id=' + encodeURIComponent(b.id); }
  function byId(id) { for (var i = 0; i < bumps.length; i++) if (bumps[i].id === id) return bumps[i]; }

  /* ---------- Lista ---------- */
  var state = { q: '', product: '', page: 1 };
  var results = document.getElementById('results');

  var filter = document.getElementById('productFilter');
  filter.innerHTML += O.PRODUCTS.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('');

  function visible() {
    var q = norm(state.q);
    return bumps.filter(function (b) {
      return (!q || norm(b.name).indexOf(q) >= 0 || norm(b.product).indexOf(q) >= 0) && (!state.product || b.product === state.product);
    });
  }

  function cardHtml(b) {
    return '<article class="ob-card' + (b.active ? '' : ' is-off') + '"><div class="ob-card-head"><div>' +
      '<span class="ob-state">' + (b.active ? 'Ativo' : 'Desativado') + '</span>' +
      '<h3 class="ob-card-title"><a href="' + editUrl(b) + '" title="' + esc(b.name) + '">' + esc(b.name) + '</a></h3>' +
      '<p class="ob-product" title="' + esc(b.product) + '">Oferta de ' + esc(b.product) + '</p></div>' +
      '<button class="pl-icon-btn" type="button" data-menu="' + b.id + '" aria-haspopup="menu" aria-expanded="false" aria-label="Ações de ' + esc(b.name) + '">' + icon('more') + '</button></div>' +
      '<div class="ob-card-foot"><span class="ob-price">' + O.money(b.price) + '</span></div></article>';
  }

  function pagerHtml(pages) {
    if (pages < 2) return '';
    var h = '<nav class="pl-pagination" aria-label="Paginação">' +
      '<button class="pl-page-btn pl-page-btn--nav" type="button" data-goto="' + (state.page - 1) + '"' + (state.page === 1 ? ' disabled' : '') + ' aria-label="Página anterior">' + icon('chevron-left') + '</button>';
    for (var i = 1; i <= pages; i++) h += '<button class="pl-page-btn' + (i === state.page ? ' is-active' : '') + '" type="button" data-goto="' + i + '"' + (i === state.page ? ' aria-current="page"' : '') + '>' + i + '</button>';
    return h + '<button class="pl-page-btn pl-page-btn--nav" type="button" data-goto="' + (state.page + 1) + '"' + (state.page === pages ? ' disabled' : '') + ' aria-label="Próxima página">' + icon('chevron-right') + '</button></nav>';
  }

  function render() {
    closeMenu();
    var list = visible(), pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    if (state.page > pages) state.page = pages;
    var start = (state.page - 1) * PER_PAGE, slice = list.slice(start, start + PER_PAGE);

    if (!bumps.length) {
      results.innerHTML = '<div class="pl-empty pl-empty--dashed" style="padding:56px 24px"><h3 class="pl-empty-title">Crie seu primeiro order bump</h3>' +
        '<p class="pl-empty-text" style="margin-bottom:20px">Ofereça um produto extra no checkout para aumentar o valor de cada venda.</p>' +
        '<a class="pl-btn pl-btn--primary" href="' + FORM + '">' + icon('plus') + 'Adicionar order bump</a></div>';
    } else if (!list.length) {
      results.innerHTML = '<div class="pl-empty pl-empty--dashed"><div class="pl-empty-icon">' + icon('search', '', 1.8) + '</div>' +
        '<h3 class="pl-empty-title">Nenhum order bump encontrado</h3><p class="pl-empty-text">Confira o nome digitado ou escolha outro produto no filtro.</p></div>';
    } else {
      var pager = pagerHtml(pages);
      results.innerHTML = '<p class="ob-count">Mostrando <strong>' + (start + 1) + '–' + (start + slice.length) + '</strong> de <strong>' + plural(list.length, 'order bump', 'order bumps') + '</strong></p>' +
        '<div class="ob-grid">' + slice.map(cardHtml).join('') + '</div>' + (pager ? '<div class="ob-footer">' + pager + '</div>' : '');
    }
  }

  /* Busca, filtro por produto e paginação */
  var search = document.getElementById('search'), searchBox = document.getElementById('searchBox');
  search.addEventListener('input', function () { state.q = search.value; state.page = 1; searchBox.classList.toggle('has-value', !!search.value); render(); });
  document.getElementById('searchClear').addEventListener('click', function (e) { e.preventDefault(); search.value = ''; state.q = ''; state.page = 1; searchBox.classList.remove('has-value'); render(); search.focus(); });
  filter.addEventListener('change', function () { state.product = filter.value; state.page = 1; render(); });
  function toggle(b) {
    b.active = !b.active; O.save(bumps); render(); toast(b.active ? 'Order bump ativado!' : 'Order bump desativado!');
    var again = results.querySelector('[data-menu="' + b.id + '"]'); if (again) again.focus({ preventScroll: true });
  }
  results.addEventListener('click', function (e) {
    var pg = e.target.closest('[data-goto]');
    if (pg && !pg.disabled) { state.page = +pg.getAttribute('data-goto'); render(); document.getElementById('toolbar').scrollIntoView({ block: 'nearest' }); }
  });

  /* Toolbar fixa no mobile ganha borda quando gruda no topo */
  var mobile = window.matchMedia('(max-width: 768px)'), toolbar = document.getElementById('toolbar');
  window.addEventListener('scroll', function () { toolbar.classList.toggle('is-stuck', mobile.matches && toolbar.getBoundingClientRect().top <= 57); }, { passive: true });

  /* ---------- Menu de ações ---------- */
  var menu = document.getElementById('cardMenu'), menuFor = null, menuBtnEl = null;
  function closeMenu() { if (menu.hidden) return; menu.hidden = true; if (menuBtnEl) menuBtnEl.setAttribute('aria-expanded', 'false'); menuFor = null; }
  function openMenu(btn) {
    menuFor = btn.getAttribute('data-menu'); menuBtnEl = btn; btn.setAttribute('aria-expanded', 'true');
    menu.querySelector('[data-act="toggle"] span').textContent = byId(menuFor).active ? 'Desativar' : 'Ativar';
    menu.hidden = false;
    var r = btn.getBoundingClientRect(), w = menu.offsetWidth, h = menu.offsetHeight;
    var top = r.bottom + 6; if (top + h > window.innerHeight - 8) top = r.top - h - 6;
    menu.style.top = Math.max(8, top) + 'px'; menu.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';
    menu.querySelector('.pl-menu-item').focus();
  }
  window.addEventListener('resize', closeMenu); window.addEventListener('scroll', closeMenu, true);
  menu.addEventListener('click', function (e) {
    var it = e.target.closest('[data-act]'); if (!it) return;
    var b = byId(menuFor), act = it.getAttribute('data-act'); closeMenu();
    if (!b) return;
    if (act === 'edit') location.href = editUrl(b);
    if (act === 'toggle') toggle(b);
    if (act === 'delete') askDelete(b);
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-menu]');
    if (t) { e.stopPropagation(); if (menuFor === t.getAttribute('data-menu') && !menu.hidden) closeMenu(); else openMenu(t); return; }
    if (!menu.hidden && !menu.contains(e.target)) closeMenu();
  });

  /* ---------- Excluir ---------- */
  var confirmEl = document.getElementById('confirm'), toDelete = null, lastFocus = null;
  function askDelete(b) {
    toDelete = b; lastFocus = menuBtnEl;
    document.getElementById('cText').textContent = '"' + b.name + '" deixa de aparecer no checkout. O produto "' + b.product + '" continua à venda.';
    confirmEl.classList.add('is-open'); confirmEl.setAttribute('aria-hidden', 'false');
    document.getElementById('cOk').focus();
  }
  function closeConfirm() { confirmEl.classList.remove('is-open'); confirmEl.setAttribute('aria-hidden', 'true'); toDelete = null; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
  confirmEl.addEventListener('click', function (e) { if (e.target === confirmEl || e.target.closest('[data-confirm-close]')) closeConfirm(); });
  document.getElementById('cOk').addEventListener('click', function () {
    bumps.splice(bumps.indexOf(toDelete), 1); O.save(bumps); lastFocus = null; closeConfirm(); render(); toast('Order bump excluído!');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!menu.hidden) { closeMenu(); if (menuBtnEl) menuBtnEl.focus(); return; }
    if (confirmEl.classList.contains('is-open')) closeConfirm();
  });

  render();
})();
</script>
</body>
